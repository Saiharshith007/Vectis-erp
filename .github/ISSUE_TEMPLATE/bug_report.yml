name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste real invoices, GSTINs or customer details. Made-up values are fine.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to Invoice → Create Invoice → Domestic
        2. Enter a client with GSTIN 29…
        3. Click Save
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit hash
  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options:
        - Local files (db/)
        - PostgreSQL
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      render: text
